<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Servicios - SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI';
        }

        h2 {
            color: #0D5B8C;
            font-weight: 800;
        }

        .card {
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
        }

        .btn-primary {
            background: #0D5B8C;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Gestión de Servicios</h2>
            <button class="btn btn-primary" onclick="nuevoServicio()">
                <i class="bi bi-plus-circle"></i> Nuevo Servicio
            </button>
        </div>

        <input type="text" id="txtBuscar" class="form-control mb-3"
               placeholder="Buscar servicio..." onkeyup="buscarServicio()">

        <div class="card">
            <table class="table table-hover text-center">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Servicio</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyServicios"></tbody>
            </table>
        </div>

    </div>

    <!-- MODAL -->
    <div class="modal fade" id="modalServicio">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header text-white" style="background:#0D5B8C;">
                    <h5 class="modal-title" id="tituloModal">Nuevo Servicio</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="idServicio">

                    <label class="form-label">Nombre</label>
                    <input class="form-control mb-3" id="nombre">

                    <label class="form-label">Precio ($)</label>
                    <input type="number" class="form-control mb-3" id="precio">

                    <label class="form-label">Descripción</label>
                    <textarea class="form-control mb-3" id="descripcion"></textarea>

                    <label class="form-label">Estado</label>
                    <select id="estado" class="form-select mb-3">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarServicio()">Guardar</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const API = "https://localhost:7148/api/Servicio";

        /* =============================
              CARGAR SERVICIOS
        ============================= */
        async function cargarServicios() {
            const resp = await fetch(API);
            const lista = await resp.json();

            let html = "";
            lista.forEach(s => {
                html += `
                <tr>
                    <td>${s.idServicio}</td>
                    <td>${s.nombre}</td>
                    <td>$${s.precio.toFixed(2)}</td>
                    <td>${s.estado}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick='editar(${JSON.stringify(s)})'>
                            <i class="bi bi-pencil"></i>
                        </button>

                        <button class="btn btn-danger btn-sm" onclick='eliminar(${s.idServicio})'>
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            });

            document.getElementById("tbodyServicios").innerHTML = html;
        }

        cargarServicios();

        /* =============================
              NUEVO
        ============================= */
        function nuevoServicio() {
            limpiar();
            document.getElementById("tituloModal").innerText = "Nuevo Servicio";
            new bootstrap.Modal(document.getElementById("modalServicio")).show();
        }

        /* =============================
              EDITAR
        ============================= */
        function editar(s) {
            document.getElementById("idServicio").value = s.idServicio;
            document.getElementById("nombre").value = s.nombre;
            document.getElementById("precio").value = s.precio;
            document.getElementById("descripcion").value = s.descripcion;
            document.getElementById("estado").value = s.estado;

            document.getElementById("tituloModal").innerText = "Editar Servicio";
            new bootstrap.Modal(document.getElementById("modalServicio")).show();
        }

        /* =============================
              GUARDAR
        ============================= */
        async function guardarServicio() {

            let data = new FormData();
            data.append("IdServicio", document.getElementById("idServicio").value || 0);
            data.append("Nombre", document.getElementById("nombre").value);
            data.append("Precio", document.getElementById("precio").value);
            data.append("Descripcion", document.getElementById("descripcion").value);
            data.append("Estado", document.getElementById("estado").value);

            let id = document.getElementById("idServicio").value;
            let metodo = id == 0 ? "POST" : "PUT";
            let url = id == 0 ? API : `${API}/${id}`;

            const resp = await fetch(url, { method: metodo, body: data });

            if (!resp.ok) {
                Swal.fire("Error", "No se pudo guardar el servicio", "error");
                return;
            }

            Swal.fire("Éxito", "Guardado correctamente", "success");
            bootstrap.Modal.getInstance(document.getElementById("modalServicio")).hide();
            cargarServicios();
        }

        /* =============================
              ELIMINAR
        ============================= */
        async function eliminar(id) {
            if (!confirm("¿Eliminar servicio?")) return;

            await fetch(`${API}/${id}`, { method: "DELETE" });
            cargarServicios();
        }

        /* =============================
              LIMPIAR CAMPOS
        ============================= */
        function limpiar() {
            idServicio.value = "";
            nombre.value = "";
            precio.value = "";
            descripcion.value = "";
            estado.value = "Activo";
        }

        /* =============================
              BUSCAR EN TABLA
        ============================= */
        function buscarServicio() {
            let texto = txtBuscar.value.toLowerCase();
            let filas = document.querySelectorAll("#tbodyServicios tr");

            filas.forEach(f => {
                f.style.display = f.innerText.toLowerCase().includes(texto) ? "" : "none";
            });
        }

    </script>

</body>
</html>
