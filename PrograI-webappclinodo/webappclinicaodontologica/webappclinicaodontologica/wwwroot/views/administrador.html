<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Panel del Administrador - SGCO</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --admin-azul: #0A3D62;
            --admin-azul-oscuro: #072F4A;
            --admin-turquesa: #3DC1D3;
            --admin-fondo: #F2F7FA;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: var(--admin-fondo);
            overflow-x: hidden;
        }

        /* ─────────── TOPBAR ─────────── */
        .topbar {
            height: 65px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            left: 260px;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 1000;
        }

            .topbar .nombre {
                font-size: 1.25rem;
                color: var(--admin-azul);
                font-weight: bold;
            }

        /* ─────────── SIDEBAR ─────────── */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100%;
            background: var(--admin-azul);
            box-shadow: 3px 0 12px rgba(0,0,0,0.15);
            padding-top: 20px;
            z-index: 1100;
        }

            .sidebar .logo-box {
                text-align: center;
                margin-bottom: 30px;
            }

                .sidebar .logo-box img {
                    width: 85px;
                    border: 3px solid var(--admin-turquesa);
                    border-radius: 50%;
                }

            .sidebar h5 {
                margin-top: 10px;
                color: var(--admin-turquesa);
                font-weight: bold;
            }

            .sidebar a {
                display: flex;
                align-items: center;
                color: white;
                padding: 12px 25px;
                text-decoration: none;
                font-size: 1.1rem;
                margin-bottom: 8px;
                border-left: 4px solid transparent;
                transition: 0.25s;
            }

                .sidebar a:hover {
                    background: var(--admin-azul-oscuro);
                    border-left-color: var(--admin-turquesa);
                }

                .sidebar a i {
                    margin-right: 12px;
                    font-size: 1.3rem;
                }

        /* ─────────── CONTENIDO ─────────── */
        .contenido {
            margin-left: 260px;
            padding: 110px 30px 30px;
        }

        .card-panel {
            background: white;
            border-radius: 20px;
            box-shadow: 0 6px 32px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 750px;
            margin: auto;
            text-align: center;
            animation: fadeIn 0.7s ease;
        }

            .card-panel h2 {
                color: var(--admin-azul);
                font-weight: 800;
            }

            .card-panel img {
                width: 170px;
                margin-top: 15px;
            }

        /* Animación suave */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo-box">
            <img src="/img/logo dclinica.png" alt="Logo SGCO">
            <h5>SGCO ADMIN</h5>
        </div>

        <!-- Rutas REALES corregidas -->
        <a href="/views/empleados_admin.html">
            <i class="bi bi-person-badge"></i> Empleados
        </a>

        <a href="/views/servicios_admin.html">
            <i class="bi bi-tooth"></i> Servicios
        </a>

        <a href="/views/citas_admin.html">
            <i class="bi bi-calendar-check"></i> Citas
        </a>

        <a href="/views/pacientes_admin.html">
            <i class="bi bi-people"></i> Pacientes
        </a>

        <a href="/views/reportes.html">
            <i class="bi bi-bar-chart-line"></i> Reportes
        </a>

        <a href="/views/bitacora.html">
            <i class="bi bi-clipboard-check"></i> Bitácora
        </a>
    </div>
    </div>

    <!-- TOPBAR -->
    <div class="topbar">
        <span class="nombre" id="nombreAdmin">Administrador</span>

        <div>
            <button class="btn btn-outline-info me-3">
                <i class="bi bi-person-circle me-1"></i> Perfil
            </button>

            <button class="btn btn-danger" onclick="cerrarSesion()">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
        </div>
    </div>

    <!-- CONTENIDO -->
    <div class="contenido">
        <div class="card-panel">
            <h2>Panel del Administrador</h2>
            <h5 id="bienvenida" class="text-secondary mb-3"></h5>
            <p>Administra empleados, servicios, citas, pacientes y reportes del sistema clínico.</p>
            <img src="/img/logo dclinica.png">
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const nombre = localStorage.getItem("nombreUsuario");
            const rol = localStorage.getItem("rolUsuario");

            if (!nombre || rol !== "Administrador") {
                window.location.href = "/views/login.html";
                return;
            }

            document.getElementById("nombreAdmin").textContent = nombre;
            document.getElementById("bienvenida").textContent = `¡Bienvenido, ${nombre}!`;
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/views/login.html";
        }
    </script>


</body>
</html>
