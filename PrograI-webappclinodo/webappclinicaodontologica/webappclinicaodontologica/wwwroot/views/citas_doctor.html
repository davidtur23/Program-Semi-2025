<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Citas de Hoy | SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef3f8;
            font-family: 'Segoe UI';
        }

        h2 {
            color: #0D5B8C;
            font-weight: 700;
        }

        .card {
            border-radius: 16px;
            box-shadow: 0px 4px 16px rgba(0,0,0,.12);
            padding: 25px;
            background: white;
        }

        /* ESTADOS */
        .estado-pendiente {
            background: #ffc107 !important;
            color: #000 !important;
        }

        .estado-enproceso {
            background: #17a2b8 !important;
            color: white !important;
        }

        .estado-finalizada {
            background: #28a745 !important;
            color: white !important;
        }

        /* BOTÓN X FLOTANTE */
        #btnCerrarPanel {
            position: fixed;
            top: 20px;
            right: 25px;
            background: white;
            color: #0D5B8C;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0px 4px 12px rgba(0,0,0,.2);
            font-size: 18px;
            z-index: 2000;
            transition: 0.2s;
        }

            #btnCerrarPanel:hover {
                background: #e2e2e2;
            }
    </style>
</head>

<body>

    <!-- BOTÓN FLOTANTE PARA VOLVER AL PANEL -->
    <div id="btnCerrarPanel" onclick="window.location.href='/views/doctor.html'">
        <i class="bi bi-x-lg"></i>
    </div>

    <div class="container py-4">

        <h2 class="mb-4">Mis Citas de Hoy</h2>

        <div class="card">

            <input type="text" id="buscar" class="form-control mb-3" placeholder="Buscar...">

            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Hora</th>
                        <th>Paciente</th>
                        <th>Motivo</th>
                        <th>Estado</th>
                        <th>Cambiar Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaDoctor"></tbody>
            </table>

        </div>

    </div>

    <script>

        const API_CITAS_DOCTOR = "/api/Cita/doctor/hoy";

        // =======================
        // Cargar citas del día
        // =======================
        document.addEventListener("DOMContentLoaded", cargarCitas);

        function cargarCitas() {
            fetch(API_CITAS_DOCTOR)
                .then(r => r.json())
                .then(data => {

                    let filas = "";
                    data.forEach(c => {

                        let claseEstado =
                            c.estado === "Pendiente" ? "estado-pendiente" :
                                c.estado === "En Proceso" ? "estado-enproceso" :
                                    "estado-finalizada";

                        filas += `
                                <tr>
                                    <td>${c.hora}</td>
                                    <td>${c.paciente}</td>
                                    <td>${c.motivo}</td>
                                    <td><span class="badge ${claseEstado} px-3 py-2">${c.estado}</span></td>
                                    <td>
                                        <button class="btn btn-primary btn-sm"
                                            onclick="cambiarEstado(${c.idCita}, '${c.estado}')">
                                            Cambiar
                                        </button>
                                    </td>
                                </tr>`;
                    });

                    document.getElementById("tablaDoctor").innerHTML = filas;
                });
        }

        // =======================
        // Cambiar estado
        // =======================
        function cambiarEstado(id, estadoActual) {

            let nuevoEstado =
                estadoActual === "Pendiente" ? "En Proceso" :
                    estadoActual === "En Proceso" ? "Finalizada" :
                        "Finalizada";

            fetch(`/api/Cita/estado/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(nuevoEstado)
            })
                .then(r => r.json())
                .then(() => cargarCitas());
        }

        // =======================
        // Buscador
        // =======================
        document.getElementById("buscar").addEventListener("keyup", function () {
            let texto = this.value.toLowerCase();
            document.querySelectorAll("#tablaDoctor tr").forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(texto) ? "" : "none";
            });
        });

    </script>

</body>
</html>
