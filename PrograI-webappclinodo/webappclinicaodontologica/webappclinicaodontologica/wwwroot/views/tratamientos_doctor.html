<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tratamientos | Doctor SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #e6f7f8;
            font-family: 'Segoe UI', sans-serif;
        }

        h2 {
            color: #0d6e6e;
            font-weight: 800;
        }

        .card {
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .1);
            padding: 22px;
        }

        .btn-principal {
            background: #0d6e6e;
            color: white;
            border-radius: 8px;
        }

            .btn-principal:hover {
                background: #094d4d;
            }

        .btn-editar {
            background: #0d6efd;
            color: white;
        }

        .btn-eliminar {
            background: #dc3545;
            color: white;
        }

        .btn-cerrar-flotante {
            position: absolute;
            top: 25px;
            right: 35px;
            background: #6c757d;
            color: white;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

            .btn-cerrar-flotante:hover {
                background: #5a6268;
            }
    </style>
</head>

<body>

    <!-- BOTÓN FLOTANTE SALIR -->
    <button class="btn btn-cerrar-flotante" onclick="window.location.href='doctor.html'">
        <i class="bi bi-x-lg"></i>
    </button>

    <div class="container py-4">

        <h2>Tratamientos</h2>

        <!-- BUSCAR PACIENTE -->
        <div id="buscadorPacientes" class="card mt-3">
            <h5>Buscar Paciente</h5>
            <input type="text" class="form-control mt-2 mb-3" id="buscarPaciente" placeholder="Escribe el nombre del paciente...">

            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaPacientes"></tbody>
            </table>
        </div>

        <!-- TRATAMIENTOS POR PACIENTE -->
        <div id="contenedorTratamientos" class="card mt-4" style="display:none;">

            <h4 id="tituloPaciente"></h4>

            <div class="d-flex justify-content-end">
                <button class="btn btn-principal mb-2" onclick="abrirModalAgregar()">
                    <i class="bi bi-plus-circle"></i> Añadir Tratamiento
                </button>
            </div>

            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Observaciones</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaTratamientos"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL AGREGAR -->
    <div class="modal fade" id="modalAgregar" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Agregar Tratamiento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label>Observaciones del tratamiento:</label>
                    <textarea id="obsAgregar" class="form-control"></textarea>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-principal" onclick="guardarNuevo()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Tratamiento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <label>Observaciones:</label>
                    <textarea id="obsEditar" class="form-control"></textarea>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-principal" onclick="guardarEdicion()">Actualizar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const API_PACIENTES = "/api/Paciente";
        const API_TRATAMIENTOS = "/api/Tratamientos";

        let pacienteSeleccionado = null;

        document.addEventListener("DOMContentLoaded", () => {
            cargarPacientes();
        });

        /* CARGAR PACIENTES */
        function cargarPacientes() {
            fetch(API_PACIENTES)
                .then(r => r.json())
                .then(data => {
                    let filas = "";

                    data.forEach(p => {
                        filas += `
                                <tr>
                                    <td>${p.idPaciente}</td>
                                    <td>${p.nombre}</td>
                                    <td>
                                        <button class="btn btn-sm btn-principal"
                                            onclick="cargarTratamientos(${p.idPaciente})">
                                            Ver tratamientos
                                        </button>
                                    </td>
                                </tr>`;
                    });

                    document.getElementById("tablaPacientes").innerHTML = filas;
                });
        }

        document.getElementById("buscarPaciente").addEventListener("keyup", function () {
            const texto = this.value.toLowerCase();

            document.querySelectorAll("#tablaPacientes tr").forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(texto) ? "" : "none";
            });
        });

        /* CARGAR TRATAMIENTOS */
        function cargarTratamientos(idPaciente) {

            pacienteSeleccionado = idPaciente;

            document.getElementById("buscadorPacientes").style.display = "none";
            document.getElementById("contenedorTratamientos").style.display = "block";

            fetch(`${API_PACIENTES}/${idPaciente}`)
                .then(r => r.json())
                .then(p => {
                    document.getElementById("tituloPaciente").innerHTML =
                        `<strong>Paciente:</strong> ${p.nombre}`;
                });

            fetch(`${API_TRATAMIENTOS}/paciente/${idPaciente}`)
                .then(r => r.json())
                .then(data => {
                    let filas = "";

                    data.forEach(t => {
                        filas += `
                                <tr>
                                    <td>${t.fechaAplicacion.split("T")[0]}</td>
                                    <td>${t.observaciones}</td>
                                    <td>
                                        <button class="btn btn-sm btn-editar"
                                            onclick="abrirModalEditar(${t.idDetalle}, \`${t.observaciones}\`)">
                                            <i class="bi bi-pencil"></i>
                                        </button>

                                        <button class="btn btn-sm btn-eliminar" onclick="eliminar(${t.idDetalle})">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>`;
                    });

                    document.getElementById("tablaTratamientos").innerHTML = filas;
                });
        }

        /* AGREGAR */
        function abrirModalAgregar() {
            new bootstrap.Modal(document.getElementById("modalAgregar")).show();
        }

        function guardarNuevo() {

            const data = {
                idPaciente: pacienteSeleccionado,
                observaciones: document.getElementById("obsAgregar").value
            };

            fetch(API_TRATAMIENTOS, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).then(() => location.reload());
        }

        /* EDITAR */
        function abrirModalEditar(id, obs) {
            document.getElementById("editId").value = id;
            document.getElementById("obsEditar").value = obs;

            new bootstrap.Modal(document.getElementById("modalEditar")).show();
        }

        function guardarEdicion() {
            const id = document.getElementById("editId").value;

            const data = {
                observaciones: document.getElementById("obsEditar").value
            };

            fetch(`${API_TRATAMIENTOS}/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).then(() => location.reload());
        }

        /* ELIMINAR */
        function eliminar(id) {
            if (!confirm("¿Seguro que deseas eliminar este tratamiento?")) return;

            fetch(`${API_TRATAMIENTOS}/${id}`, {
                method: "DELETE"
            }).then(() => location.reload());
        }

    </script>

</body>
</html>
