<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicios - Recepcionista | SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef3f8;
            font-family: 'Segoe UI';
        }

        /* BOTÓN X FLOTANTE */
        #btnCerrarPanel {
            position: fixed;
            top: 15px;
            right: 20px;
            background: white;
            color: #0D5B8C;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0px 2px 6px rgba(0,0,0,.2);
            z-index: 2000;
        }

            #btnCerrarPanel:hover {
                background: #e6e6e6;
            }

        /* TITULO */
        h2 {
            font-weight: 800;
            color: #0D5B8C;
        }

        /* TARJETA */
        .card {
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        /* TABLA MEJORADA */
        table thead {
            background: #0D5B8C;
            color: white;
            font-size: 15px;
            letter-spacing: .5px;
        }

        table tbody tr:hover {
            background: #e8f6ff !important;
        }

        .search-box {
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <!-- BOTÓN X -->
    <div id="btnCerrarPanel" onclick="window.location.href='recepcionista.html'">
        <i class="bi bi-x-lg"></i>
    </div>

    <!-- CONTENIDO -->
    <div class="container py-4">

        <h2 class="mb-4">Servicios Disponibles</h2>

        <!-- BUSCADOR -->
        <div class="card mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text"
                       id="buscar"
                       class="form-control search-box"
                       placeholder="Buscar servicio..."
                       onkeyup="filtrarTabla()">
            </div>
        </div>

        <!-- TABLA -->
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover text-center align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Servicio</th>
                            <th>Precio</th>
                            <th style="width:40%">Descripción</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyServicios"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API = "/api/Servicio";

        document.addEventListener("DOMContentLoaded", () => {
            cargarServicios();
            validarSesion();
        });

        /* ===============================
                VALIDAR SESIÓN
        =============================== */
        function validarSesion() {
            const nombre = localStorage.getItem("nombreUsuario");
            const rol = localStorage.getItem("rolUsuario");

            if (!nombre || rol !== "Recepcionista") {
                window.location.href = "/views/login.html";
                return;
            }
        }

        /* ===============================
                CARGAR SERVICIOS
        =============================== */
        async function cargarServicios() {
            const res = await fetch(API);
            const data = await res.json();

            let tbody = document.getElementById("tbodyServicios");
            tbody.innerHTML = "";

            data.forEach(s => {
                tbody.innerHTML += `
                        <tr>
                            <td>${s.idServicio}</td>
                            <td><b>${s.nombre}</b></td>
                            <td>$${s.precio.toFixed(2)}</td>
                            <td style="text-align: justify;">${s.descripcion}</td>
                            <td><span class="badge bg-success">${s.estado}</span></td>
                        </tr>`;
            });
        }

        /* ===============================
                FILTRAR TABLA
        =============================== */
        function filtrarTabla() {
            let filtro = document.getElementById("buscar").value.toLowerCase();
            let filas = document.querySelectorAll("#tbodyServicios tr");

            filas.forEach(f => {
                let texto = f.innerText.toLowerCase();
                f.style.display = texto.includes(filtro) ? "" : "none";
            });
        }
    </script>

</body>
</html>
