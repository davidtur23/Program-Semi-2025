<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Citas | SGCO Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f2f7fb;
            font-family: 'Segoe UI';
        }

        h2 {
            font-weight: 700;
            color: #0B436A;
        }

        .card {
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
        }

        .table thead {
            background: #0B436A;
            color: white;
        }

        .btn-refresh {
            background: #0B436A;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Gestión de Citas</h2>

            <button class="btn btn-refresh" onclick="cargarCitas()">
                <i class="bi bi-arrow-clockwise"></i> Actualizar
            </button>
        </div>

        <div class="card p-3">
            <input type="text" id="buscar" class="form-control mb-3" placeholder="Buscar citas...">

            <div class="table-responsive">
                <table class="table table-hover" id="tablaCitas">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Paciente</th>
                            <th>Doctor</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const API = "/api/Cita";

        document.addEventListener("DOMContentLoaded", () => {
            cargarCitas();
        });

        function cargarCitas() {
            fetch(API)
                .then(r => r.json())
                .then(data => {
                    let filas = "";

                    data.forEach(c => {
                        filas += `
                            <tr>
                                <td>${c.idCita}</td>
                                <td>${c.paciente}</td>
                                <td>${c.doctor}</td>
                                <td>${c.fecha.split("T")[0]}</td>
                                <td>${c.hora}</td>
                                <td>${c.motivo}</td>
                                <td>${c.estado}</td>
                            </tr>
                        `;
                    });

                    document.querySelector("#tablaCitas tbody").innerHTML = filas;
                });
        }

        // Buscador en tabla
        document.getElementById("buscar").addEventListener("keyup", function () {
            let texto = this.value.toLowerCase();
            document.querySelectorAll("#tablaCitas tbody tr").forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(texto) ? "" : "none";
            });
        });
    </script>

</body>
</html>
