<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Citas - Recepcionista | SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef3f8;
            font-family: 'Segoe UI';
        }

        h2 {
            color: #0D5B8C;
            font-weight: 700;
        }

        .card {
            border-radius: 14px;
            box-shadow: 0px 4px 16px rgba(0,0,0,.1);
        }

        .btn-primary {
            background: #0D5B8C;
            border: none;
        }

            .btn-primary:hover {
                background: #094868;
            }

        .modal-header {
            background: #0D5B8C;
            color: white;
        }

        .table thead {
            background: #0D5B8C;
            color: white;
        }

        .info-box {
            padding: 18px;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        /* Botón X flotante */
        #btnCerrarPanel {
            position: fixed;
            top: 15px;
            right: 20px;
            background: white;
            color: #0D5B8C;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0px 2px 6px rgba(0,0,0,.2);
            z-index: 2000;
        }

            #btnCerrarPanel:hover {
                background: #e6e6e6;
            }
    </style>
</head>

<body>

    <!-- BOTÓN X PARA SALIR AL PANEL -->
    <div id="btnCerrarPanel" onclick="window.location.href='recepcionista.html'">
        <i class="bi bi-x-lg"></i>
    </div>

    <div class="container py-4">

        <!-- PANEL SUPERIOR -->
        <div class="row mb-4">

            <div class="col-md-4">
                <div class="info-box" style="background:#0D5B8C;">
                    <div id="totalCitasHoy">0</div>
                    <small>Citas de Hoy</small>
                </div>
            </div>

            <div class="col-md-4">
                <div class="info-box" style="background:#1572A1;">
                    <div id="proximaHoraLibre">--:--</div>
                    <small>Última cita de hoy</small>
                </div>
            </div>

            <div class="col-md-4">
                <div class="info-box text-center" style="background:#51C4D3;">
                    <button class="btn btn-light" onclick="toggleAgendaDia()">
                        <i class="bi bi-calendar-week"></i> Ver Agenda del Día
                    </button>
                </div>
            </div>

        </div>

        <!-- TÍTULO Y BOTÓN -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Gestión de Citas</h2>

            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAgregar">
                <i class="bi bi-plus-circle"></i> Nueva Cita
            </button>
        </div>

        <!-- TABLA PRINCIPAL -->
        <div class="card p-3">
            <input type="text" id="buscar" class="form-control mb-3" placeholder="Buscar citas...">

            <div class="table-responsive">
                <table class="table table-hover" id="tablaCitas">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Paciente</th>
                            <th>Doctor</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- AGENDA DEL DÍA -->
        <div class="card p-3 mt-4" id="agendaDia" style="display:none;">
            <h5><i class="bi bi-calendar-week"></i> Citas de Hoy</h5>

            <div class="table-responsive mt-3">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Paciente</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCitasHoy"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- MODAL AGREGAR -->
    <div class="modal fade" id="modalAgregar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Nueva Cita</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <label>Paciente</label>
                    <select id="IdPaciente" class="form-control mb-2"></select>

                    <label>Fecha</label>
                    <input type="date" id="Fecha" class="form-control mb-2">

                    <label>Hora disponible</label>
                    <select id="Hora" class="form-control mb-2"></select>

                    <label>Motivo</label>
                    <textarea id="Motivo" class="form-control mb-2"></textarea>

                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarCita()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Editar Cita</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="editIdCita">

                    <label>Paciente</label>
                    <select id="editIdPaciente" class="form-control mb-2"></select>

                    <label>Fecha</label>
                    <input type="date" id="editFecha" class="form-control mb-2">

                    <label>Hora disponible</label>
                    <select id="editHora" class="form-control mb-2"></select>

                    <label>Motivo</label>
                    <textarea id="editMotivo" class="form-control mb-2"></textarea>

                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarEdicion()">Actualizar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_CITAS = "/api/Cita";
        const API_PACIENTES = "/api/Paciente";

        document.addEventListener("DOMContentLoaded", () => {
            cargarPacientes();
            cargarCitas();
            cargarDatosDelDia();

            // Buscador
            const txtBuscar = document.getElementById("buscar");
            txtBuscar.addEventListener("keyup", () => {
                const texto = txtBuscar.value.toLowerCase();
                document.querySelectorAll("#tablaCitas tbody tr").forEach(fila => {
                    fila.style.display = fila.innerText.toLowerCase().includes(texto) ? "" : "none";
                });
            });

            // Evento fecha para horas disponibles (nuevo)
            document.getElementById("Fecha").addEventListener("change", () => {
                const fecha = document.getElementById("Fecha").value;
                cargarHorasDisponibles(fecha, "Hora");
            });
        });

        /* ============= PANEL DEL DÍA ============= */
        function cargarDatosDelDia() {
            // Tu controlador actual de hoy devuelve una LISTA, no {citas, proximaHora}
            fetch("/api/Cita/hoy")
                .then(r => r.json())
                .then(lista => {

                    // Total de citas hoy
                    document.getElementById("totalCitasHoy").innerText = lista.length;

                    // Última hora de las citas de hoy (si hay)
                    let proxima = "Sin citas hoy";
                    if (lista.length > 0) {
                        const ultima = lista[lista.length - 1];
                        proxima = ultima.hora; // ya viene formateada en el controlador
                    }
                    document.getElementById("proximaHoraLibre").innerText = proxima;

                    // Llenar tabla de agenda
                    let html = "";
                    lista.forEach(c => {
                        html += `
                                <tr>
                                    <td>${c.hora}</td>
                                    <td>${c.paciente}</td>
                                    <td>${c.motivo}</td>
                                    <td>${c.estado}</td>
                                </tr>`;
                    });
                    document.getElementById("tablaCitasHoy").innerHTML = html;
                });
        }

        function toggleAgendaDia() {
            const panel = document.getElementById("agendaDia");
            if (panel.style.display === "none" || panel.style.display === "") {
                panel.style.display = "block";
                cargarDatosDelDia();
            } else {
                panel.style.display = "none";
            }
        }

        /* ============= PACIENTES ============= */
        function cargarPacientes(selectId = "IdPaciente") {
            fetch(API_PACIENTES)
                .then(r => r.json())
                .then(data => {
                    let html = "";
                    data.forEach(p => {
                        html += `<option value="${p.idPaciente}">${p.nombre}</option>`;
                    });
                    const combo = document.getElementById(selectId);
                    if (combo) combo.innerHTML = html;
                });
        }

        /* ============= HORAS DISPONIBLES ============= */
        function cargarHorasDisponibles(fecha, selectId) {
            if (!fecha) return;

            fetch(`/api/Cita/horas-disponibles/${fecha}`)
                .then(r => r.json())
                .then(data => {
                    let html = "";
                    data.forEach(h => {
                        html += `<option value="${h}">${h}</option>`;
                    });
                    const combo = document.getElementById(selectId);
                    if (combo) combo.innerHTML = html;
                });
        }

        /* ============= CARGAR CITAS ============= */
        function cargarCitas() {
            fetch(API_CITAS)
                .then(r => r.json())
                .then(data => {
                    let filas = "";
                    data.forEach(c => {
                        // c.fecha viene como "yyyy-MM-dd" o "yyyy-MM-ddTHH:mm:ss"
                        let fechaTexto = c.fecha;
                        if (fechaTexto.includes("T")) {
                            fechaTexto = fechaTexto.split("T")[0];
                        }

                        filas += `
                                <tr>
                                    <td>${c.idCita}</td>
                                    <td>${c.paciente}</td>
                                    <td>${c.doctor}</td>
                                    <td>${fechaTexto}</td>
                                    <td>${c.hora}</td>
                                    <td>${c.motivo}</td>
                                    <td>${c.estado}</td>
                                    <td>
                                        <button class="btn btn-warning btn-sm" onclick="abrirEditar(${c.idCita})">
                                            <i class="bi bi-pencil-square"></i>
                                        </button>
                                        <button class="btn btn-danger btn-sm" onclick="eliminarCita(${c.idCita})">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>`;
                    });

                    document.querySelector("#tablaCitas tbody").innerHTML = filas;
                });
        }

        /* ============= GUARDAR NUEVA CITA ============= */
        function guardarCita() {
            const idPaciente = parseInt(document.getElementById("IdPaciente").value);
            const fecha = document.getElementById("Fecha").value;
            const hora = document.getElementById("Hora").value;
            const motivo = document.getElementById("Motivo").value;

            const data = {
                idPaciente: idPaciente,
                doctor: "Doctor General",
                fecha: fecha,
                hora: hora,
                motivo: motivo
            };

            fetch(API_CITAS, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(async r => {
                    if (!r.ok) {
                        let error;
                        try {
                            error = await r.json();
                            alert(error.mensaje || "Error al guardar la cita");
                        } catch {
                            alert("Error al guardar la cita");
                        }
                        return;
                    }

                    cargarCitas();
                    cargarDatosDelDia();

                    const modal = bootstrap.Modal.getInstance(document.getElementById("modalAgregar"));
                    modal.hide();
                });
        }

        /* ============= ABRIR MODAL EDITAR ============= */
        function abrirEditar(id) {
            fetch(API_CITAS + "/" + id)
                .then(r => r.json())
                .then(c => {

                    // Inputs
                    const txtIdCita = document.getElementById("editIdCita");
                    const txtFecha = document.getElementById("editFecha");
                    const txtMotivo = document.getElementById("editMotivo");

                    txtIdCita.value = c.idCita;

                    // Cargar pacientes en el combo de edición
                    cargarPacientes("editIdPaciente");

                    // Esperar un poquito para poner el valor
                    setTimeout(() => {
                        const comboPac = document.getElementById("editIdPaciente");
                        if (comboPac) comboPac.value = c.idPaciente;
                    }, 150);

                    // Fecha
                    let fechaTexto = c.fecha;
                    if (fechaTexto.includes("T")) {
                        fechaTexto = fechaTexto.split("T")[0];
                    }
                    txtFecha.value = fechaTexto;

                    // Cargar horas disponibles de esa fecha
                    cargarHorasDisponibles(fechaTexto, "editHora");

                    setTimeout(() => {
                        const comboHora = document.getElementById("editHora");
                        if (comboHora) comboHora.value = c.hora;
                    }, 150);

                    txtMotivo.value = c.motivo;

                    const modalEditar = new bootstrap.Modal(document.getElementById("modalEditar"));
                    modalEditar.show();
                });
        }

        /* ============= GUARDAR EDICIÓN ============= */
        function guardarEdicion() {
            const idCita = parseInt(document.getElementById("editIdCita").value);
            const idPaciente = parseInt(document.getElementById("editIdPaciente").value);
            const fecha = document.getElementById("editFecha").value;
            const hora = document.getElementById("editHora").value;
            const motivo = document.getElementById("editMotivo").value;

            const data = {
                idCita: idCita,
                idPaciente: idPaciente,
                doctor: "Doctor General",
                fecha: fecha,
                hora: hora,
                motivo: motivo
            };

            fetch(API_CITAS + "/" + idCita, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(() => {
                    cargarCitas();
                    cargarDatosDelDia();

                    const modal = bootstrap.Modal.getInstance(document.getElementById("modalEditar"));
                    modal.hide();
                });
        }

        /* ============= ELIMINAR ============= */
        function eliminarCita(id) {
            if (!confirm("¿Seguro de eliminar esta cita?")) return;

            fetch(API_CITAS + "/" + id, { method: "DELETE" })
                .then(() => {
                    cargarCitas();
                    cargarDatosDelDia();
                });
        }
    </script>

</body>
</html>
