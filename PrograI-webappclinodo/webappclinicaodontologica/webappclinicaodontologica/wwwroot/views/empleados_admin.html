<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Empleados - SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f2f7fb;
            font-family: "Segoe UI";
        }

        .card {
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .btn-primary {
            background: #0D5B8C;
            border: none;
        }

            .btn-primary:hover {
                background: #0b4c77;
            }

        .table thead {
            background: #0D5B8C;
            color: white;
        }

        .modern-input {
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #d0d7de;
            transition: .2s;
        }

            .modern-input:focus {
                border-color: #0D5B8C;
                box-shadow: 0 0 6px rgba(13,91,140,0.3);
            }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold" style="color:#0D5B8C;">Gestión de Empleados</h2>
            <button class="btn btn-primary" onclick="abrirNuevo()">
                <i class="bi bi-plus-circle"></i> Nuevo Empleado
            </button>
        </div>

        <div class="card p-4">
            <input type="text" id="buscar" onkeyup="filtrarTabla()" class="form-control modern-input mb-3"
                   placeholder="🔍 Buscar empleado por nombre, usuario o rol...">

            <table class="table table-hover" id="tablaEmpleados">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="modalEmpleado">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header text-white" style="background:#0D5B8C;">
                    <h5 class="modal-title" id="tituloModal">Nuevo Empleado</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="idEmpleado">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input id="nombre" class="form-control modern-input">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Apellido</label>
                            <input id="apellido" class="form-control modern-input">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Usuario</label>
                            <input id="usuario" class="form-control modern-input">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input id="contrasena" type="password" class="form-control modern-input">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Rol</label>
                            <select id="rol" class="form-select modern-input"></select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Estado</label>
                            <select id="estado" class="form-select modern-input">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarEmpleado()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API = "https://localhost:7148/api/Empleado";
        const API_ROL = "https://localhost:7148/api/Rol";

        /* ===============================
              CARGAR ROLES EN SELECT
        ================================ */
        async function cargarRoles() {
            const res = await fetch(API_ROL);
            const roles = await res.json();

            let select = document.getElementById("rol");
            select.innerHTML = "";

            roles.forEach(r => {
                select.innerHTML += `<option value="${r.idRol}">${r.rolNombre}</option>`;
            });
        }

        /* ===============================
              CARGAR EMPLEADOS
        ================================ */
        async function cargarEmpleados() {
            const res = await fetch(API);
            const data = await res.json();

            const tbody = document.querySelector("#tablaEmpleados tbody");
            tbody.innerHTML = "";

            data.forEach(emp => {
                tbody.innerHTML += `
                <tr>
                    <td>${emp.idEmpleado}</td>
                    <td>${emp.nombre} ${emp.apellido}</td>
                    <td>${emp.usuario}</td>
                    <td>${emp.nombreRol}</td>
                    <td>${emp.estado}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editarEmpleado(${emp.idEmpleado})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="eliminarEmpleado(${emp.idEmpleado})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>`;
            });
        }

        /* ===============================
              ABRIR MODAL PARA NUEVO
        ================================ */
        function abrirNuevo() {
            limpiarCampos();
            cargarRoles();
            document.getElementById("tituloModal").innerText = "Nuevo Empleado";
            new bootstrap.Modal(document.getElementById("modalEmpleado")).show();
        }

        /* ===============================
              EDITAR EMPLEADO
        ================================ */
        async function editarEmpleado(id) {
            const res = await fetch(`${API}/${id}`);
            const emp = await res.json();

            cargarRoles();

            document.getElementById("idEmpleado").value = emp.idEmpleado;
            document.getElementById("nombre").value = emp.nombre;
            document.getElementById("apellido").value = emp.apellido;
            document.getElementById("usuario").value = emp.usuario;
            document.getElementById("contrasena").value = emp.contrasena;
            document.getElementById("rol").value = emp.idRol;
            document.getElementById("estado").value = emp.estado;

            document.getElementById("tituloModal").innerText = "Editar Empleado";

            new bootstrap.Modal(document.getElementById("modalEmpleado")).show();
        }

        /* ===============================
                    GUARDAR
        ================================ */
        async function guardarEmpleado() {
            let emp = {
                idEmpleado: parseInt(document.getElementById("idEmpleado").value) || 0,
                nombre: document.getElementById("nombre").value.trim(),
                apellido: document.getElementById("apellido").value.trim(),
                usuario: document.getElementById("usuario").value.trim(),
                contrasena: document.getElementById("contrasena").value.trim(),
                idRol: parseInt(document.getElementById("rol").value),
                estado: document.getElementById("estado").value
            };

            // Validación básica
            if (!emp.nombre || !emp.apellido || !emp.usuario || !emp.contrasena || !emp.idRol) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Campos incompletos',
                    text: 'Por favor completa todos los campos.',
                    confirmButtonColor: '#0D5B8C'
                });
                return;
            }

            let metodo = emp.idEmpleado === 0 ? "POST" : "PUT";
            let url = emp.idEmpleado === 0 ? API : `${API}/${emp.idEmpleado}`;

            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(emp)
                });

                // Si la API responde error
                if (!res.ok) {

                    let mensaje = "No se pudo guardar el empleado";

                    // Lee el texto devuelto por la API
                    const texto = await res.text();

                    if (texto.includes("duplicado")) {
                        mensaje = "❌ El usuario ya existe, intenta otro nombre de usuario.";
                    }

                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        html: mensaje,
                        confirmButtonColor: '#d9534f'
                    });

                    return;
                }

                // ÉXITO
                Swal.fire({
                    icon: 'success',
                    title: 'Completado',
                    text: emp.idEmpleado === 0 ? 'Empleado creado exitosamente' : 'Empleado actualizado exitosamente',
                    confirmButtonColor: '#0D5B8C'
                });

                bootstrap.Modal.getInstance(document.getElementById('modalEmpleado')).hide();
                cargarEmpleados();

            } catch (error) {

                Swal.fire({
                    icon: 'error',
                    title: 'Error inesperado',
                    text: 'Hubo un problema de conexión.',
                    confirmButtonColor: '#d9534f'
                });

                console.error("ERROR:", error);
            }
        }


        /* ===============================
                    ELIMINAR
        ================================ */
        async function eliminarEmpleado(id) {
            if (!confirm("¿Seguro que deseas eliminar este empleado?")) return;

            await fetch(`${API}/${id}`, { method: "DELETE" });

            cargarEmpleados();
        }

        /* ===============================
                    BUSCAR
        ================================ */
        function filtrarTabla() {
            const filtro = document.getElementById("buscar").value.toLowerCase();
            const filas = document.querySelectorAll("#tablaEmpleados tbody tr");

            filas.forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(filtro) ? "" : "none";
            });
        }

        /* ===============================
                LIMPIAR FORM
        ================================ */
        function limpiarCampos() {
            document.getElementById("idEmpleado").value = "";
            document.getElementById("nombre").value = "";
            document.getElementById("apellido").value = "";
            document.getElementById("usuario").value = "";
            document.getElementById("contrasena").value = "";
            document.getElementById("estado").value = "Activo";
        }

        cargarEmpleados();
    </script>

</body>
</html>
