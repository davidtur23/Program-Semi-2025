<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pacientes | SGCO ADMIN</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef5fa;
            font-family: 'Segoe UI';
        }

        h2 {
            font-weight: 700;
            color: #0D5B8C;
        }

        .card {
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .table thead {
            background: #0D5B8C;
            color: white;
        }

        .btn-volver {
            background: #0D5B8C;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Pacientes Registrados</h2>

            <button class="btn btn-volver" onclick="window.location.href='administrador.html'">
                <i class="bi bi-arrow-left"></i> Volver al Panel
            </button>
        </div>

        <div class="card p-3">
            <input type="text" id="buscar" class="form-control mb-3" placeholder="Buscar paciente...">

            <div class="table-responsive">
                <table class="table table-hover" id="tablaPacientes">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Dirección</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const API = "/api/Paciente";

        document.addEventListener("DOMContentLoaded", () => {
            cargarPacientes();
        });

        function cargarPacientes() {
            fetch(API)
                .then(r => r.json())
                .then(data => {
                    let filas = "";

                    data.forEach(p => {
                        filas += `
                            <tr>
                                <td>${p.idPaciente}</td>
                                <td>${p.nombre}</td>
                                <td>${p.edad || '-'}</td>
                                <td>${p.telefono || '-'}</td>
                                <td>${p.correo || '-'}</td>
                                <td>${p.direccion || '-'}</td>
                            </tr>
                        `;
                    });

                    document.querySelector("#tablaPacientes tbody").innerHTML = filas;
                });
        }

        // Buscador en tiempo real
        document.getElementById("buscar").addEventListener("keyup", function () {
            let texto = this.value.toLowerCase();
            document.querySelectorAll("#tablaPacientes tbody tr").forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(texto) ? "" : "none";
            });
        });
    </script>

</body>
</html>
