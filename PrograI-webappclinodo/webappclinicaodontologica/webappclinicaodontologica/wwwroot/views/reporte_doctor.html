<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte Médico | SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #e6f7f8;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.12);
        }

        .btn-principal {
            background: #0d6e6e;
            color: white;
        }

            .btn-principal:hover {
                background: #0a5050;
            }

        .btn-pdf {
            background: #dc3545;
            color: white;
        }

            .btn-pdf:hover {
                background: #b32d3a;
            }

        .preview-box {
            background: white;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #cfcfcf;
        }
    </style>
</head>

<body>

    <!-- BOTÓN DE CERRAR -->
    <button class="btn btn-secondary position-fixed" style="top:20px; right:20px;"
            onclick="window.location.href='doctor.html'">
        <i class="bi bi-x-lg"></i>
    </button>

    <div class="container mt-4">

        <h2 class="text-center fw-bold mb-4" style="color:#0d6e6e;">Generar Reporte Profesional</h2>

        <!-- BUSCADOR -->
        <div class="card p-4 mb-4">
            <h5>Buscar Paciente</h5>
            <input id="buscarPaciente" class="form-control mt-2" placeholder="Escribe el nombre del paciente...">

            <table class="table table-hover mt-3">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaPacientes"></tbody>
            </table>
        </div>

        <!-- PREVIEW DEL REPORTE -->
        <div id="contenedorPreview" style="display:none;">
            <h4 id="tituloReporte" class="fw-bold"></h4>

            <div class="preview-box mb-3">
                <h5 class="fw-bold">🩺 Historial Clínico</h5>
                <table class="table table-bordered mt-2" id="tablaHistorial"></table>

                <h5 class="fw-bold mt-4">💊 Tratamientos Realizados</h5>
                <table class="table table-bordered mt-2" id="tablaTratamientos"></table>
            </div>

            <button class="btn btn-pdf" onclick="generarPDF()">
                <i class="bi bi-file-earmark-pdf"></i> Descargar Reporte PDF
            </button>
        </div>

    </div>


    <!-- LIBRERÍA PARA GENERAR PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        const API_PACIENTES = "/api/Paciente";
        const API_HISTORIAL = "/api/Historial/paciente/";
        const API_TRATAMIENTOS = "/api/Tratamientos/paciente/";

        let pacienteSeleccionado = null;

        document.addEventListener("DOMContentLoaded", () => cargarPacientes());

        function cargarPacientes() {
            fetch(API_PACIENTES)
                .then(r => r.json())
                .then(data => {
                    let filas = "";
                    data.forEach(p => {
                        filas += `
                                <tr>
                                    <td>${p.idPaciente}</td>
                                    <td>${p.nombre}</td>
                                    <td><button class="btn btn-principal btn-sm"
                                        onclick="mostrarReporte(${p.idPaciente}, '${p.nombre}')">Ver reporte</button></td>
                                </tr>`;
                    });
                    document.getElementById("tablaPacientes").innerHTML = filas;
                });
        }

        // Buscador
        document.getElementById("buscarPaciente").addEventListener("keyup", function () {
            let txt = this.value.toLowerCase();
            document.querySelectorAll("#tablaPacientes tr").forEach(f =>
                f.style.display = f.innerText.toLowerCase().includes(txt) ? "" : "none"
            );
        });

        // Cargar información
        function mostrarReporte(idPaciente, nombre) {
            pacienteSeleccionado = idPaciente;
            document.getElementById("contenedorPreview").style.display = "block";
            document.getElementById("tituloReporte").innerText = `Reporte Clínico de: ${nombre}`;

            // Historial
            fetch(API_HISTORIAL + idPaciente)
                .then(r => r.json())
                .then(data => {
                    let tabla = `<tr><th>Fecha</th><th>Diagnóstico</th><th>Tratamiento</th></tr>`;
                    data.forEach(h => {
                        tabla += `
                                <tr>
                                    <td>${h.fechaRegistro.split("T")[0]}</td>
                                    <td>${h.diagnostico}</td>
                                    <td>${h.tratamientoSugerido}</td>
                                </tr>`;
                    });
                    document.getElementById("tablaHistorial").innerHTML = tabla;
                });

            // Tratamientos
            fetch(API_TRATAMIENTOS + idPaciente)
                .then(r => r.json())
                .then(data => {
                    let tabla = `<tr><th>Fecha</th><th>Observaciones</th></tr>`;
                    data.forEach(t => {
                        tabla += `
                                <tr>
                                    <td>${t.fechaAplicacion.split("T")[0]}</td>
                                    <td>${t.observaciones}</td>
                                </tr>`;
                    });
                    document.getElementById("tablaTratamientos").innerHTML = tabla;
                });
        }

        // GENERAR PDF MEJORADO
        function generarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF("p", "mm", "letter");

            doc.setFontSize(20);
            doc.text("Reporte Clínico SGCO", 20, 20);

            doc.setFontSize(12);
            doc.text(`Paciente ID: ${pacienteSeleccionado}`, 20, 30);

            doc.setLineWidth(0.5);
            doc.line(20, 35, 200, 35);

            doc.setFontSize(14);
            doc.text("Historial Clínico", 20, 50);

            let y = 60;
            document.querySelectorAll("#tablaHistorial tr").forEach(row => {
                doc.setFontSize(10);
                doc.text(row.innerText, 20, y);
                y += 6;
            });

            y += 10;
            doc.setFontSize(14);
            doc.text("Tratamientos Realizados", 20, y);
            y += 10;

            document.querySelectorAll("#tablaTratamientos tr").forEach(row => {
                doc.setFontSize(10);
                doc.text(row.innerText, 20, y);
                y += 6;
            });

            doc.save("reporte_clinico.pdf");
        }
    </script>

</body>
</html>
