<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pacientes | Doctor SGCO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #e4f6f7;
            font-family: 'Segoe UI';
        }

        h2 {
            font-weight: 700;
            color: #0B6B74;
        }

        .card {
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,.08);
            background: white;
            padding: 22px;
        }

        .table thead {
            background: #0B6B74;
            color: white;
        }

        /* BOTÓN X FLOTANTE */
        #btnCerrarPanel {
            position: fixed;
            top: 20px;
            right: 25px;
            background: white;
            color: #0B6B74;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0px 4px 12px rgba(0,0,0,.2);
            font-size: 18px;
            z-index: 2000;
            transition: 0.2s;
        }

            #btnCerrarPanel:hover {
                background: #e2e2e2;
            }
    </style>
</head>

<body>

    <!-- X PARA VOLVER AL PANEL -->
    <div id="btnCerrarPanel" onclick="window.location.href='/views/doctor.html'">
        <i class="bi bi-x-lg"></i>
    </div>

    <div class="container py-4">

        <h2 class="mb-4">Pacientes Registrados</h2>

        <div class="card">
            <input type="text" id="buscar" class="form-control mb-3" placeholder="Buscar paciente...">

            <div class="table-responsive">
                <table class="table table-hover" id="tablaPacientes">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const API = "/api/Paciente";

        document.addEventListener("DOMContentLoaded", () => {
            cargarPacientes();
        });

        function cargarPacientes() {
            fetch(API)
                .then(r => r.json())
                .then(data => {
                    let filas = "";

                    data.forEach(p => {
                        filas += `
                                <tr>
                                    <td>${p.idPaciente}</td>
                                    <td>${p.nombre}</td>
                                    <td>${p.edad || '-'}</td>
                                    <td>${p.telefono || '-'}</td>
                                    <td>${p.correo || '-'}</td>
                                </tr>
                            `;
                    });

                    document.querySelector("#tablaPacientes tbody").innerHTML = filas;
                });
        }

        // Buscador
        document.getElementById("buscar").addEventListener("keyup", function () {
            let texto = this.value.toLowerCase();
            document.querySelectorAll("#tablaPacientes tbody tr").forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(texto) ? "" : "none";
            });
        });
    </script>

</body>
</html>
