<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SGCO - Inicio de Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        :root {
            --azul-oscuro: #063970;
            --azul-medio: #0D5B8C;
            --celeste: #5FD3D4;
            --fondo-claro: #F2F6F9;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--azul-oscuro);
            font-family: 'Segoe UI', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* LOGO GIGANTE DE FONDO A LA IZQUIERDA */
        .logo-bg {
            position: absolute;
            left: -5%;
            top: 50%;
            transform: translateY(-50%);
            width: 700px;
            opacity: 0.14;
            filter: brightness(300%);
            z-index: 1;
            pointer-events: none;
        }

        .login-box {
            width: 900px;
            height: 500px;
            display: flex;
            border-radius: 18px;
            overflow: hidden;
            background: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.35);
            z-index: 10;
            position: relative;
        }

        /* PANEL IZQUIERDO */
        .left-panel {
            width: 45%;
            background: linear-gradient(180deg, var(--azul-medio), var(--azul-oscuro));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            color: white;
            position: relative;
            z-index: 20;
        }

        /* CÍRCULO BLANCO PRINCIPAL */
        .logo-wrapper {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            box-shadow: 0 0 28px rgba(255,255,255,0.45);
        }

            /* LOGO GRANDE DENTRO DEL CÍRCULO */
            .logo-wrapper img {
                width: 135px; /* LOGO AGRANDADO */
                max-width: 85%;
                max-height: 85%;
            }

        .left-panel h2 {
            font-size: 1.7rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* PANEL DERECHO */
        .right-panel {
            width: 55%;
            background: var(--fondo-claro);
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 20;
        }

            .right-panel h3 {
                text-align: center;
                font-weight: bold;
                color: var(--azul-oscuro);
                margin-bottom: 25px;
            }

        .btn-login {
            width: 100%;
            background: var(--azul-medio);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 5px;
            font-size: 1rem;
            margin-top: 10px;
        }

            .btn-login:hover {
                background: var(--celeste);
                color: var(--azul-oscuro);
            }

        footer {
            position: absolute;
            bottom: 15px;
            color: #bcd0e6;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- LOGO GIGANTE COMO MARCA DE AGUA A LA IZQUIERDA -->
    <img src="/img/logo dclinica.png" class="logo-bg">

    <div class="login-box">

        <!-- PANEL IZQUIERDO -->
        <div class="left-panel">

            <!-- LOGO PRINCIPAL MÁS GRANDE -->
            <div class="logo-wrapper">
                <img src="/img/logo dclinica.png" alt="Logo SGCO">
            </div>

            <h2>SGCO</h2>
            <p>Sistema de Gestión de Consultorio Odontológico</p>
        </div>

        <!-- PANEL DERECHO -->
        <div class="right-panel">

            <h3>Iniciar Sesión</h3>

            <form id="loginForm">

                <!-- SELECTOR DE ROL -->
                <div class="mb-3">
                    <label class="form-label">Seleccione su rol</label>
                    <select id="rol" class="form-select" required>
                        <option value="">Seleccione...</option>
                        <option value="1">Recepcionista</option>
                        <option value="2">Doctor</option>
                        <option value="3">Administrador</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="usuario" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" required>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <div id="errorMsg" class="alert alert-danger mt-3 d-none"></div>

        </div>
    </div>

    <footer>
        © 2025 SGCO – Sistema de Gestión de Consultorio Odontológico
    </footer>

    <!-- SCRIPT LOGIN -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const usuario = document.getElementById("usuario").value;
            const contrasena = document.getElementById("contrasena").value;
            const idRol = parseInt(document.getElementById("rol").value);

            const respuesta = await fetch("https://localhost:7148/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    usuario: usuario,
                    contrasena: contrasena,
                    idRol: idRol
                })
            });

            const datos = await respuesta.json();

            if (respuesta.ok) {
                // Guardar datos en el navegador
                localStorage.setItem("nombreUsuario", datos.nombre);
                localStorage.setItem("rolUsuario", datos.rol);

                // Redirigir al panel correcto
                window.location.href = datos.panel;
            } else {
                const errorMsg = document.getElementById("errorMsg");
                errorMsg.textContent = datos || "Datos incorrectos";
                errorMsg.classList.remove("d-none");
            }
        });
    </script>




</body>
</html>
